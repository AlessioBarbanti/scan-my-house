<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0A0A">
  <title>Piantina — Trilocale Via Paisiello</title>

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #0A0A0A;
      color: #EDE8E0;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* ── Page shell ── */
    .page {
      background: #0A0A0A;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 540px;
      margin: 0 auto;
    }

    /* ── Header ── */
    .page-header {
      flex-shrink: 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: max(env(safe-area-inset-top, 0px), 20px) 20px 0;
      animation: fadeUp 0.5s ease both;
    }

    .page-header__back {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 50%;
      text-decoration: none;
      color: rgba(237,232,224,0.55);
      flex-shrink: 0;
      margin-top: 2px;
      -webkit-tap-highlight-color: transparent;
    }

    .page-header__back:active { opacity: 0.7; }

    .page-header__eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75em;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #9A938D;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .page-header__eyebrow-line {
      display: inline-block;
      width: 18px;
      height: 1px;
      background: #4A4845;
    }

    .page-header__title {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(1.8rem, 6vw, 2.2rem);
      line-height: 1;
      color: #EDE8E0;
      letter-spacing: -0.02em;
    }

    /* ── Subtitle ── */
    .page-subtitle {
      flex-shrink: 0;
      padding: 10px 20px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.875em;
      color: #9A938D;
      line-height: 1.5;
      animation: fadeUp 0.5s ease both 0.1s;
    }

    /* ── Floor plan container ── */
    .floorplan-wrap {
      flex: 1;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      animation: fadeUp 0.6s ease both 0.14s;
      padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    }

    /* ── Legend ── */
    .legend {
      display: flex;
      align-items: center;
      gap: 0;
      margin-bottom: 10px;
      padding: 0 2px;
    }

    .legend__item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend__dot {
      width: 14px;
      height: 3px;
      border-radius: 2px;
    }

    .legend__dot--window { background: #3A5B6E; }
    .legend__dot--door   { background: #6A6560; }


    .legend__sep {
      width: 1px;
      height: 10px;
      background: rgba(255,255,255,0.06);
      margin: 0 14px;
    }

    .legend__label {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75em;
      color: #9A938D;
      letter-spacing: 0.05em;
    }

    .legend__sqm {
      margin-left: auto;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75em;
      color: #9A938D;
    }

    .room-fill { cursor: pointer; }

    /* ── SVG wrapper ── */
    .floorplan-svg-wrap {
      background: #0F0F0F;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
      box-shadow: 0 8px 48px rgba(0,0,0,0.7);
    }

    .floorplan-svg-wrap svg {
      width: 100%;
      display: block;
    }

    /* ── Overlay ── */
    .room-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 99;
    }

    .room-overlay.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    /* ── Bottom sheet ── */
    .bottom-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #191919;
      border-radius: 20px 20px 0 0;
      border-top: 1px solid rgba(255,255,255,0.07);
      transform: translateY(110%);
      transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1);
      z-index: 100;
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      max-width: 540px;
      margin-left: auto;
      margin-right: auto;
    }

    .bottom-sheet.is-open {
      transform: translateY(0);
    }

    /* Handle */
    .sheet-handle {
      display: flex;
      justify-content: center;
      padding: 10px 0 0;
    }

    .sheet-handle__bar {
      width: 36px;
      height: 4px;
      background: #2E2E2E;
      border-radius: 2px;
    }

    /* Sheet header */
    .sheet-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 14px 20px 0;
    }

    .sheet-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
      line-height: 1;
      color: #EDE8E0;
      letter-spacing: -0.02em;
    }

    .sheet-mq {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8125em;
      color: #9A938D;
      margin-left: 10px;
      line-height: 1.6;
    }

    .sheet-close {
      width: 32px;
      height: 32px;
      background: rgba(255,255,255,0.06);
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #999;
      font-size: 0.8125em;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: sans-serif;
      margin-top: 2px;
    }

    .sheet-close:active { opacity: 0.6; }

    /* Room image */
    .sheet-img-wrap {
      padding: 12px 20px 0;
    }

    .sheet-img {
      width: 100%;
      height: 300px;
      border-radius: 14px;
      object-fit: cover;
      background: #1A1A1A;
      display: block;
    }

    /* Tour CTA */
    .sheet-tour-cta {
      padding: 14px 20px 0;
    }

    .sheet-tour-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      height: 52px;
      background: #C4A56A;
      border-radius: 13px;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .sheet-tour-btn:active { opacity: 0.88; }

    .sheet-tour-btn__label {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.875em;
      font-weight: 600;
      color: #0A0A0A;
      letter-spacing: 0.01em;
    }

    /* ── Landscape ── */
    @media (max-height: 500px) {
      .sheet-img {
        height: 200px;
      }

      .bottom-sheet {
        max-height: 90vh;
        overflow-y: auto;
      }
    }
  </style>
</head>
